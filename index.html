<style>

.ambient{position:fixed;inset:-15%;pointer-events:none;background:radial-gradient(ellipse at 78% 3%,var(--bg1),transparent 52%),radial-gradient(ellipse at 10% 76%,var(--bg2),transparent 53%),linear-gradient(155deg,#0e0c1c,var(--bg3));filter:saturate(.9);transform:translateZ(0)}.ambient:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 62% 45%,#a58ae51a,transparent 45%);opacity:var(--glow);animation:breath 13s ease-in-out infinite alternate}.ambient:after{content:"";position:absolute;inset:0;background:#070710;opacity:var(--darken)}
#app{height:100dvh;position:relative;max-width:620px;margin:auto;display:flex;flex-direction:column;padding:calc(21px + env(safe-area-inset-top)) 22px calc(14px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;min-height:42px}.brand{font-size:12px;letter-spacing:.33em;font-weight:750;color:#d7ccff}.brand span{font-weight:450;color:#9990b5}.round{height:43px;width:43px;border-radius:16px;background:#ffffff0d;border:1px solid #ffffff20;box-shadow:inset 0 1px #ffffff16;display:grid;place-items:center;backdrop-filter:blur(18px)}.round svg{width:21px;height:21px;stroke:#d7c9fc;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hero{padding:44px 3px 21px}.eyebrow{color:var(--accent);font-size:10px;font-weight:750;letter-spacing:.26em;text-transform:uppercase}.hero h1{font-size:clamp(49px,12vw,72px);line-height:1.06;letter-spacing:-.074em;font-weight:630;margin:13px 0 11px;text-shadow:0 8px 35px #0004}.subtitle{font-size:13px;line-height:1.5;color:var(--muted);min-height:20px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:7px 0 21px}.day{padding:12px 0;min-width:0;border-radius:13px;border:1px solid #ffffff0a;background:#ffffff08;color:#aaa2be;font-size:11px;font-weight:720;transition:background .25s,transform .25s,color .25s}.day.active{background:linear-gradient(135deg,#dfd5ff,#b9a4fc);color:#1d1738;box-shadow:0 5px 27px #bba5fd3a;transform:translateY(-2px)}.day.today:not(.active):after{content:"";display:block;height:3px;width:3px;border-radius:50%;background:#c7b4ff;margin:3px auto -6px}
.viewport{flex:1;min-height:0;position:relative}.list{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:5px 2px 110px;touch-action:pan-y}.list::-webkit-scrollbar{display:none}.task{user-select:none;-webkit-user-select:none;position:relative;min-height:73px;margin-bottom:11px;display:flex;align-items:center;gap:15px;padding:19px 19px;border-radius:22px;overflow:hidden;background:linear-gradient(130deg,#ffffff20,#ffffff0b 67%);border:1px solid #ffffff21;box-shadow:inset 0 1px #ffffff22,0 10px 26px #00000022;backdrop-filter:blur(24px);animation:enter .34s cubic-bezier(.16,1,.3,1) both;touch-action:pan-y}.task:before{content:"";position:absolute;inset:0 auto auto 16%;height:1px;width:65%;background:linear-gradient(90deg,transparent,#ffffff38,transparent)}.task .orb{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#cbbfff;box-shadow:0 0 17px #a88aff6b}.task .name{font-size:15px;line-height:1.5;font-weight:540;overflow-wrap:anywhere;flex:1}.task .chev{font-size:22px;color:#9c94b0}.task .progress{position:absolute;inset:0;background:linear-gradient(90deg,#d0b9ff48,#d0b9ff05);transform:scaleX(0);transform-origin:left;pointer-events:none}.task.holding .progress{animation:fill .64s linear forwards}.task.removing{animation:fizzle .4s ease-in forwards;pointer-events:none}.particles{position:absolute;inset:0;pointer-events:none}.spark{position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);border-radius:50%;background:#dfceff;animation:spark .48s ease-out forwards}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:260px;height:55%;gap:13px;color:#8f879d}.empty .symbol{font-size:45px;line-height:1;color:#bba7fc88;text-shadow:0 0 28px #bba7fc33}.empty strong{font-weight:540;color:#dcd4f0;font-size:17px}.empty span{font-size:12px;line-height:1.7;max-width:220px}.add{width:100%;padding:20px;border:1px dashed #ffffff36;background:#ffffff06;border-radius:21px;color:#bcb2d7;margin-top:8px;font-size:13px}.add:active,.round:active,.pill:active{transform:scale(.96)}
.bottom{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:22px;right:22px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}.pill{pointer-events:auto;display:flex;align-items:center;gap:9px;padding:15px 19px;border:1px solid #ffffff27;border-radius:19px;background:#292538cc;box-shadow:0 6px 26px #0005,inset 0 1px #ffffff22;backdrop-filter:blur(24px);font-size:13px;font-weight:620;transition:transform .18s}.pill svg{width:17px;height:17px;stroke:var(--accent);stroke-width:2;fill:none}.hint{font-size:10px;color:#a99fbc;line-height:1.5;text-align:right;max-width:135px;text-shadow:0 1px 10px #000}
.rubble{position:relative;min-height:max(350px,75%);padding-bottom:110px}.scrap{position:absolute;left:var(--left);top:var(--top);width:var(--width);max-width:270px;min-height:85px;padding:16px 16px 20px;border:1px solid #ffffff25;border-radius:6px 13px 10px 7px;background:linear-gradient(145deg,#555064ee,#302c3fdd);box-shadow:0 14px 22px #0006;transform:rotate(var(--rotation));animation:paperfall .78s cubic-bezier(.12,.8,.2,1) both;animation-delay:var(--delay);text-align:left;overflow-wrap:anywhere;touch-action:manipulation}.scrap strong{display:block;font-size:13px;line-height:1.4;font-weight:560}.scrap small{display:block;font-size:10px;color:#d4cbe4;margin-top:11px}.scrap:active{filter:brightness(1.25)}
.veil{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;background:#06040c9e;backdrop-filter:blur(12px);animation:fade .2s}.sheet{max-height:90dvh;overflow-y:auto;width:100%;max-width:620px;padding:17px 24px calc(31px + env(safe-area-inset-bottom));border-radius:32px 32px 0 0;border:1px solid #ffffff2a;background:linear-gradient(150deg,#353047f7,#1a1929fa 75%);box-shadow:0 -20px 80px #0008,inset 0 1px #ffffff35;animation:up .36s cubic-bezier(.16,1,.3,1)}.handle{height:4px;width:38px;margin:0 auto 26px;border-radius:8px;background:#ffffff35}.sheet .kicker{font-size:10px;letter-spacing:.23em;color:#c5b3ff;font-weight:750}.sheet h2{font-size:27px;line-height:1.15;letter-spacing:-.04em;margin:12px 30px 19px 0;overflow-wrap:anywhere}.sheet label{display:block;color:#b6afca;font-size:12px;margin:18px 0 9px}.sheet input[type=text],.sheet textarea,.sheet select{width:100%;border-radius:15px;background:#0b0c1d99;border:1px solid #ffffff26;padding:15px;color:#f7f4ff;outline:0}.sheet input:focus,.sheet textarea:focus{border-color:#b8a6ff}.sheet textarea{min-height:110px;resize:vertical}.sheet p.description{line-height:1.65;color:#c1bad5;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:23px}.actions button,.choice{border:1px solid #ffffff1b;background:#ffffff13;padding:13px 15px;border-radius:14px;font-size:13px;font-weight:630}.actions .primary,.choice.selected{background:#c8b8ff;color:#211a36;border-color:transparent}.actions .danger{background:#553747;color:#ffc3ce}.close{float:right;border:0;background:none;color:#cbc3df;font-size:25px;padding:0 3px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.choice{padding:13px 3px}.settingsline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:22px 0;font-size:14px}.settingsline input[type=checkbox]{width:21px;height:21px;accent-color:#c4b5ff}.settingsline input[type=range]{width:51%;accent-color:#c4b5ff}.smallprint{font-size:11px;color:#a8a0ba;line-height:1.6}.backdrop-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.backdrop-options button{height:53px;border-radius:13px;border:2px solid transparent;font-size:12px;font-weight:700}.backdrop-options button.selected{border-color:#dfd1ff}.backdrop-options button[data-theme=violet]{background:linear-gradient(130deg,#39305b,#191624)}.backdrop-options button[data-theme=ocean]{background:linear-gradient(130deg,#15445a,#101a30)}.backdrop-options button[data-theme=ember]{background:linear-gradient(130deg,#62364b,#241723)}
#toast{position:fixed;z-index:20;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;padding:11px 16px;border:1px solid #ffffff25;border-radius:50px;background:#333047ed;backdrop-filter:blur(20px);opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 9px 30px #0005}#toast.visible{opacity:1}
@keyframes breath{to{transform:translate(5%,-4%) scale(1.1);opacity:.55}}@keyframes enter{from{opacity:0;transform:translateY(17px) scale(.96)}to{opacity:1;transform:none}}@keyframes fill{to{transform:scaleX(1)}}@keyframes fizzle{0%{opacity:1;filter:blur(0);transform:scale(1)}55%{opacity:.9;filter:blur(1px);transform:scale(1.045)}100%{opacity:0;filter:blur(11px);transform:scale(.75) rotate(4deg)}}@keyframes spark{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.1)}}@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(65px);opacity:.6}}@keyframes paperfall{from{opacity:0;transform:translateY(-190px) rotate(calc(var(--rotation) + 35deg)) scale(1.15)}to{opacity:1;transform:rotate(var(--rotation))}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<div class="ambient" aria-hidden="true"></div><div id="app"><header class="top"><div class="brand">DRIFT <span>/ YOUR WEEK</span></div><button id="settingsButton" class="round" aria-label="Preferences"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.5 1.5m10.4 10.4 1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/></svg></button></header><section class="hero"><div class="eyebrow" id="eyebrow"></div><h1 id="heading"></h1><div class="subtitle" id="subtitle"></div></section><nav class="days" id="days" aria-label="Weekdays"></nav><main class="viewport"><div id="list" class="list" aria-label="Tasks"></div></main><footer class="bottom"><button class="pill" id="navigation"><svg viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6"/></svg><span id="navLabel">Heap</span></button><span class="hint" id="hint"></span></footer></div><div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const abbr=['M','T','W','T','F','S','S'];const STORAGE='drift-v1';const $=id=>document.getElementById(id);
const logicalDate=()=>{const d=new Date();d.setHours(d.getHours()-4);return d};const localKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const currentKey=()=>localKey(logicalDate());const dayIndex=d=>(d.getDay()+6)%7;const today=()=>dayIndex(logicalDate());const fromKey=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3],12);return localKey(d)===s?d:null};const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
let data;try{data=JSON.parse(localStorage.getItem(STORAGE))}catch{}if(!data||!Array.isArray(data.tasks))data={tasks:[],trash:[],lastDate:currentKey(),settings:{}};data.trash=Array.isArray(data.trash)?data.trash:[];data.settings=Object.assign({sound:true,haptics:true,dim:12,theme:'violet',motion:true},data.settings);if(!['violet','ocean','ember'].includes(data.settings.theme))data.settings.theme='violet';data.tasks=data.tasks.filter(t=>t&&typeof t.title==='string'&&(t.day==='heap'||Number.isInteger(t.day)&&t.day>=0&&t.day<7));data.trash=data.trash.filter(t=>t&&typeof t.title==='string');let view=today(),modal=null,audio,holdTimer=null,pressFired=false,pressStart=null,toastTimer;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch{toast('Storage full — please export a backup')}}
function rollover(){const now=currentKey();if(data.lastDate===now)return;const prev=fromKey(data.lastDate),next=fromKey(now);if(!prev||!next){data.lastDate=now;save();return}const elapsed=Math.round((next-prev)/86400000);if(elapsed<0){data.lastDate=now;save();return}if(elapsed>0){/* Each elapsed 4 AM boundary moves only the previous day's remaining tasks. */for(let i=0;i<Math.min(elapsed,7);i++){const d=new Date(prev);d.setDate(d.getDate()+i);const from=dayIndex(d),to=(from+1)%7;for(const task of data.tasks)if(task.day===from)task.day=to}if(elapsed>7){/* All week slots are caught up after a full cycle. */for(const task of data.tasks)if(Number.isInteger(task.day))task.day=today()}data.lastDate=now;save()}}
function theme(){let palette={violet:['#332d55','#15172e','#181221'],ocean:['#153e54','#102d3b','#121626'],ember:['#543048','#2b192b','#1e111d']}[data.settings.theme];palette.forEach((v,i)=>document.documentElement.style.setProperty('--bg'+(i+1),v));document.documentElement.style.setProperty('--darken',String(Math.min(90,Math.max(0,Number(data.settings.dim)||0))/100));document.documentElement.style.setProperty('--glow',data.settings.motion?'1':'0')}
function haptic(kind='tap'){if(!data.settings.haptics)return;try{navigator.vibrate?.(kind==='delete'?[15,35,20]:kind==='hold'?18:8)}catch{}}
function sound(kind='tap'){if(!data.settings.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio ||=new AC();if(audio.state==='suspended')audio.resume();let t=audio.currentTime;let tones=kind==='delete'?[480,320,180]:kind==='create'?[415,620]:[390,530];tones.forEach((hz,i)=>{let osc=audio.createOscillator(),gain=audio.createGain(),start=t+i*.045;osc.type='sine';osc.frequency.setValueAtTime(hz,start);osc.frequency.exponentialRampToValueAtTime(Math.max(90,hz*.78),start+.13);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.042,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+.15);osc.connect(gain);gain.connect(audio.destination);osc.start(start);osc.stop(start+.16)})}catch{}}
function feedback(kind='tap'){haptic(kind);sound(kind)}function toast(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),2200)}
function setView(to){if(to===view)return;view=to;feedback();render();$('list').scrollTop=0}function title(s){let p=document.createElement('span');p.textContent=s;return p}
function render(){rollover();theme();const isDay=Number.isInteger(view),isTrash=view==='trash';$('eyebrow').textContent=isTrash?'THE AFTERLIFE':view==='heap'?'UNSCHEDULED':view===today()?'TODAY · A FRESH PAGE':'A DAY IN YOUR CYCLE';$('heading').textContent=isTrash?'The rubble.':view==='heap'?'The heap.':days[view]+'.';const items=isTrash?data.trash:data.tasks.filter(t=>t.day===view);$('subtitle').textContent=isTrash?'Every finished thought leaves a trace.':view==='heap'?'For things that can wait a little.':`${items.length} ${items.length===1?'task':'tasks'} · unfinished tasks drift at 4 AM`;
$('days').style.visibility=isDay?'visible':'hidden';$('days').style.pointerEvents=isDay?'auto':'none';$('days').innerHTML='';days.forEach((d,i)=>{let b=document.createElement('button');b.className='day'+(view===i?' active':'')+(today()===i?' today':'');b.textContent=abbr[i];b.title=d;b.setAttribute('aria-label',d);if(i===view)b.setAttribute('aria-current','date');b.onclick=()=>setView(i);$('days').append(b)});$('navLabel').textContent=isTrash?'Back to heap':view==='heap'?'Recently deleted':'Open heap';$('hint').textContent=isTrash?'Tap a piece to restore':view==='heap'?'Swipe up for the week':'Swipe sideways · hold to add';$('list').innerHTML='';
if(!items.length){let empty=document.createElement('div');empty.className='empty';const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=isTrash?'✧':'✦';let strong=document.createElement('strong');strong.textContent=isTrash?'Nothing lost.':'A little breathing room.';let hint=document.createElement('span');hint.textContent=isTrash?'Finished tasks will gently land here.':'Hold anywhere empty to add a task.';empty.append(symbol,strong,hint);$('list').append(empty)}
if(isTrash){const pile=document.createElement('div');pile.className='rubble';const count=Math.min(items.length,80),height=Math.max(410,Math.ceil(count/5)*85+330);pile.style.height=height+'px';items.slice(0,80).slice().reverse().forEach((t,j)=>{let el=document.createElement('button');el.className='scrap';const i=count-1-j;const offset=((i*73+29)%79);el.style.setProperty('--left',(4+offset*.47)+'%');el.style.setProperty('--top',(36+(i*89)%Math.max(100,height-180))+'px');el.style.setProperty('--width',(44+i%3*4)+'%');el.style.setProperty('--rotation',((i*23)%35-17)+'deg');el.style.setProperty('--delay',Math.min(j*45,600)+'ms');let name=document.createElement('strong');name.textContent=t.title;let s=document.createElement('small');s.textContent='Tap to restore';el.append(name,s);el.onclick=()=>restore(t.id);pile.append(el)});$('list').append(pile)}else{items.forEach((t,i)=>{let el=document.createElement('div');el.className='task';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',t.title+'. Hold to complete, tap to view.');el.style.animationDelay=Math.min(250,i*38)+'ms';el.innerHTML='<span class="progress"></span><span class="orb"></span><span class="name"></span><span class="chev">›</span>';el.querySelector('.name').textContent=t.title;attachHold(el,()=>remove(t.id,el),()=>openTask(t.id));el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTask(t.id)}};$('list').append(el)});let b=document.createElement('button');b.className='add';b.textContent='+  Add a thought';b.onclick=openCreate;$('list').append(b)}}
function remove(id,el){let idx=data.tasks.findIndex(t=>t.id===id);if(idx<0)return;let task=data.tasks.splice(idx,1)[0];task.deletedAt=Date.now();data.trash.unshift(task);data.trash=data.trash.slice(0,80);feedback('delete');save();closeModal();if(el&&el.isConnected&&data.settings.motion&&!matchMedia('(prefers-reduced-motion: reduce)').matches){el.classList.remove('holding');el.classList.add('removing');let particles=document.createElement('div');particles.className='particles';for(let i=0;i<12;i++){let p=document.createElement('span');p.className='spark';p.style.cssText=`--x:${10+Math.random()*80}%;--y:${10+Math.random()*80}%;--size:${2+Math.random()*6}px;--dx:${(Math.random()-.5)*120}px;--dy:${(Math.random()-.5)*120}px`;particles.append(p)}el.append(particles);setTimeout(()=>{render();toast('Completed · saved in rubble')},380)}else{render();toast('Completed · saved in rubble')}}
function restore(id){let idx=data.trash.findIndex(t=>t.id===id);if(idx<0)return;let t=data.trash.splice(idx,1)[0];delete t.deletedAt;data.tasks.push(t);save();feedback('create');render();toast('Restored to '+(t.day==='heap'?'heap':days[t.day]))}
function attachHold(el,long,tap){let timer=null,start=null,fired=false,cancelled=false;const stop=()=>{clearTimeout(timer);timer=null;el.classList.remove('holding')};el.addEventListener('pointerdown',e=>{if(e.button!==0)return;cancelled=false;fired=false;start=[e.clientX,e.clientY];timer=setTimeout(()=>{fired=true;stop();long()},640);el.classList.add('holding')});el.addEventListener('pointermove',e=>{if(start&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>14){cancelled=true;stop()}});el.addEventListener('pointerup',()=>{stop()});el.addEventListener('pointercancel',()=>{cancelled=true;stop()});el.addEventListener('pointerleave',()=>{cancelled=true;stop()});el.addEventListener('click',e=>{if(fired||cancelled){e.preventDefault();return}tap()});el.addEventListener('contextmenu',e=>e.preventDefault())}
function sheet(){closeModal();const veil=document.createElement('div');veil.className='veil';veil.innerHTML='<section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div><button class="close" aria-label="Close">×</button><div class="content"></div></section>';veil.addEventListener('click',e=>{if(e.target===veil)closeModal()});veil.querySelector('.close').onclick=closeModal;document.body.append(veil);modal=veil;return veil.querySelector('.content')}function closeModal(){modal?.remove();modal=null}function dom(html){let e=document.createElement('div');e.innerHTML=html;return e}function focusLater(el){setTimeout(()=>el?.focus(),140)}
function openCreate(){if(view==='trash')return;feedback('hold');let content=sheet();content.innerHTML='<div class="kicker">NEW THOUGHT</div><h2>What’s on your mind?</h2><label for="taskTitle">Title</label><input id="taskTitle" type="text" maxlength="140" placeholder="Something to do…"><label for="taskDescription">Description · optional</label><textarea id="taskDescription" maxlength="5000" placeholder="A little more detail…"></textarea><div class="actions"><button class="primary" id="createTask">Add task</button></div>';const create=()=>{let name=$('taskTitle').value.trim();if(!name){$('taskTitle').focus();return}data.tasks.push({id:uid(),title:name,description:$('taskDescription').value.trim(),day:view,createdAt:Date.now()});save();feedback('create');closeModal();render();toast('Added to '+(view==='heap'?'heap':days[view]))};$('createTask').onclick=create;$('taskTitle').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();create()}};focusLater($('taskTitle'))}
function openTask(id){let t=data.tasks.find(t=>t.id===id);if(!t)return;feedback();let content=sheet();content.innerHTML='<div class="kicker">YOUR THOUGHT</div><h2 class="taskTitle"></h2><p class="description"></p><div class="actions"><button class="primary" id="nextDay">↗ Next day</button><button id="moveTo">Move to…</button><button id="editTask">Edit</button><button class="danger" id="finishTask">✓ Complete</button></div><div class="choices" id="choices" hidden></div>';content.querySelector('.taskTitle').textContent=t.title;content.querySelector('.description').textContent=t.description||'No description yet.';$('nextDay').onclick=()=>{t.day=(Number.isInteger(t.day)?t.day+1:today()+1)%7;save();feedback();closeModal();render();toast('Delayed to '+days[t.day])};$('finishTask').onclick=()=>remove(id);$('editTask').onclick=()=>openEdit(id);$('moveTo').onclick=()=>{let c=$('choices');c.hidden=!c.hidden;if(c.hidden)return;c.innerHTML='';[...days,'Heap'].forEach((name,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=name==='Heap'?'Heap':name.slice(0,3);b.onclick=()=>{t.day=i===7?'heap':i;save();feedback();closeModal();render();toast('Moved to '+(t.day==='heap'?'heap':days[t.day]))};c.append(b)})}}
function openEdit(id){let t=data.tasks.find(t=>t.id===id);if(!t)return;let content=sheet();content.innerHTML='<div class="kicker">REFINE A THOUGHT</div><h2>Edit task.</h2><label for="editTitle">Title</label><input id="editTitle" type="text" maxlength="140"><label for="editDescription">Description</label><textarea id="editDescription" maxlength="5000"></textarea><div class="actions"><button class="primary" id="saveEdit">Save changes</button><button id="cancelEdit">Cancel</button></div>';$('editTitle').value=t.title;$('editDescription').value=t.description||'';$('saveEdit').onclick=()=>{let newTitle=$('editTitle').value.trim();if(!newTitle){$('editTitle').focus();return}t.title=newTitle;t.description=$('editDescription').value.trim();save();feedback();closeModal();render();toast('Changes saved')};$('cancelEdit').onclick=()=>openTask(id);focusLater($('editTitle'))}
function downloadBackup(){const blob=new Blob([JSON.stringify({app:'drift',version:2,exportedAt:new Date().toISOString(),tasks:data.tasks,trash:data.trash,settings:data.settings,lastDate:data.lastDate},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='drift-backup-'+currentKey()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup downloaded')}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(imported.app!=='drift'||!Array.isArray(imported.tasks)||!Array.isArray(imported.trash))throw Error('Not a Drift backup');if(!confirm('Replace all tasks and completed items with this backup?'))return;const valid=t=>t&&typeof t.title==='string'&&t.title.length>0&&(t.day==='heap'||Number.isInteger(t.day)&&t.day>=0&&t.day<7);data.tasks=imported.tasks.filter(valid).map(t=>({id:String(t.id||uid()),title:t.title.slice(0,140),description:String(t.description||'').slice(0,5000),day:t.day,createdAt:t.createdAt||Date.now()}));data.trash=imported.trash.filter(valid).slice(0,80).map(t=>({id:String(t.id||uid()),title:t.title.slice(0,140),description:String(t.description||'').slice(0,5000),day:t.day,createdAt:t.createdAt||Date.now(),deletedAt:t.deletedAt||Date.now()}));data.lastDate=fromKey(imported.lastDate)?imported.lastDate:currentKey();if(imported.settings&&typeof imported.settings==='object')data.settings=Object.assign(data.settings,imported.settings);save();rollover();view=today();closeModal();render();toast('Backup restored')}catch{toast('Could not read that backup')}};reader.readAsText(file)}
function settings(){let content=sheet();content.innerHTML='<div class="kicker">MAKE IT YOURS</div><h2>Preferences.</h2><label>Ambient background</label><div class="backdrop-options"><button data-theme="violet">Violet</button><button data-theme="ocean">Ocean</button><button data-theme="ember">Ember</button></div><div class="settingsline"><span>Darken background</span><input id="dim" type="range" min="0" max="90" step="1"></div><div class="settingsline"><span>Sound effects</span><input id="sound" type="checkbox"></div><div class="settingsline"><span>Haptic feedback</span><input id="haptics" type="checkbox"></div><div class="settingsline"><span>Ambient motion</span><input id="motion" type="checkbox"></div><div class="actions"><button id="export">Export backup</button><button id="import">Import backup</button><input id="file" type="file" accept="application/json,.json" hidden></div><p class="smallprint">Your week repeats, and unfinished tasks for the day move to tomorrow at 4 AM when you next open or return to the app. Completing a task puts it in the rubble. Everything is saved on this device only; export backups regularly. Haptics depend on Android and browser support.</p><div class="actions"><button class="primary" id="done">Done</button></div>';$('dim').value=data.settings.dim;for(let k of ['sound','haptics','motion'])$(''+k).checked=!!data.settings[k];$('dim').oninput=e=>{data.settings.dim=+e.target.value;save();theme()};for(let k of ['sound','haptics','motion'])$(k).onchange=e=>{data.settings[k]=e.target.checked;save();theme()};content.querySelectorAll('[data-theme]').forEach(btn=>{btn.classList.toggle('selected',btn.dataset.theme===data.settings.theme);btn.onclick=()=>{data.settings.theme=btn.dataset.theme;save();theme();content.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('selected',b===btn));feedback()}});$('export').onclick=downloadBackup;$('import').onclick=()=>$('file').click();$('file').onchange=e=>importBackup(e.target.files[0]);$('done').onclick=closeModal}
// Briefly holding blank space creates a task, even if the day has no tasks.
const list=$('list');list.addEventListener('pointerdown',e=>{if(e.button!==0||view==='trash'||e.target.closest('.task,button,.scrap'))return;pressFired=false;pressStart=[e.clientX,e.clientY];clearTimeout(holdTimer);holdTimer=setTimeout(()=>{pressFired=true;openCreate()},580)});list.addEventListener('pointermove',e=>{if(pressStart&&Math.hypot(e.clientX-pressStart[0],e.clientY-pressStart[1])>12)clearTimeout(holdTimer)});['pointerup','pointercancel','pointerleave'].forEach(name=>list.addEventListener(name,()=>{clearTimeout(holdTimer);pressStart=null}));list.addEventListener('contextmenu',e=>e.preventDefault());
// Swipe navigation ignores buttons and dialogs. Vertical swipe respects scrolling.
let touch=null;$('app').addEventListener('touchstart',e=>{if(modal||e.target.closest('button,input,textarea,.task,.scrap'))return;let p=e.touches[0];touch={x:p.clientX,y:p.clientY,scroll:list.scrollTop}},{passive:true});$('app').addEventListener('touchend',e=>{if(!touch||modal)return;let p=e.changedTouches[0],dx=p.clientX-touch.x,dy=p.clientY-touch.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25){if(typeof view==='number')setView((view+(dx<0?1:6))%7);else if(view==='heap'&&dx>0)setView(today())}else if(dy>95&&Math.abs(dy)>Math.abs(dx)*1.25&&touch.scroll===0){if(view==='heap')setView('trash');else if(typeof view==='number')setView('heap')}else if(dy< -95&&Math.abs(dy)>Math.abs(dx)*1.25){if(view==='trash')setView('heap');else if(view==='heap')setView(today())}touch=null},{passive:true});$('navigation').onclick=()=>setView(view==='trash'?'heap':view==='heap'?'trash':'heap');$('settingsButton').onclick=settings;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(modal)return;if(e.key==='ArrowLeft'&&typeof view==='number')setView((view+1)%7);if(e.key==='ArrowRight'&&typeof view==='number')setView((view+6)%7)});document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(()=>{if(!document.hidden&&currentKey()!==data.lastDate)render()},60000);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
