<script>
(()=>{'use strict';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const KEY='drift-v1';const $=id=>document.getElementById(id);const makeId=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);
const logic=()=>{const d=new Date();d.setHours(d.getHours()-4);return d};const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const todayKey=()=>dateKey(logic());const weekday=d=>(d.getDay()+6)%7;const today=()=>weekday(logic());const fromKey=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3],12);return dateKey(d)===s?d:null};
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.tasks))data={tasks:[],trash:[],settings:{},lastDate:todayKey()};data.trash=Array.isArray(data.trash)?data.trash:[];data.settings=Object.assign({sound:true,haptics:true,dim:30,theme:'iridescent',motion:true},data.settings);if(!['iridescent','moon','blue'].includes(data.settings.theme))data.settings.theme='iridescent';data.tasks=data.tasks.filter(t=>t&&typeof t.title==='string'&&(t.day==='heap'||Number.isInteger(t.day)&&t.day>=0&&t.day<7));data.trash=data.trash.filter(t=>t&&typeof t.title==='string');let view=today(),modal=null,toastTimer=null,audio=null,blankTimer=null,blankStart=null,suppressClickUntil=0,transition='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{toast('Storage unavailable — export a backup')}}

function theme(){const palettes={iridescent:['#9f9dd5','#8bd8e6','#dc80c5','#e9b6a1','#7773ac','#554d74','#7371a4'],moon:['#544a83','#aaa0d0','#9d6eaf','#927fa5','#454063','#28243e','#474366'],blue:['#29647e','#77cbd4','#6a92cc','#9b8ac5','#3f7590','#2d466d','#5b81aa']}[data.settings.theme];const sky=$('sky');sky.style.background=`radial-gradient(ellipse at 12% 18%,${palettes[0]} 0%,transparent 44%),radial-gradient(ellipse at 89% 12%,${palettes[1]} 0%,transparent 41%),radial-gradient(ellipse at 44% 60%,${palettes[2]} 0%,transparent 48%),radial-gradient(ellipse at 98% 78%,${palettes[3]} 0%,transparent 40%),linear-gradient(145deg,${palettes[4]},${palettes[5]} 50%,${palettes[6]})`;document.documentElement.style.setProperty('--dim',(Math.max(0,Math.min(90,+data.settings.dim||0))/100).toString());document.body.classList.toggle('no-motion',!data.settings.motion)}
function vibration(kind){if(!data.settings.haptics)return;try{navigator.vibrate?.(kind==='finish'?[14,26,20]:kind==='hold'?18:8)}catch{}}
function chime(kind='tap'){if(!data.settings.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio ||=new AC();if(audio.state==='suspended')audio.resume();const tones=kind==='finish'?[510,360,225]:kind==='create'?[465,690]:[480];tones.forEach((hz,i)=>{const osc=audio.createOscillator(),gain=audio.createGain(),at=audio.currentTime+i*.052;osc.type='sine';osc.frequency.setValueAtTime(hz,at);osc.frequency.exponentialRampToValueAtTime(hz*.8,at+.13);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.032,at+.009);gain.gain.exponentialRampToValueAtTime(.0001,at+.17);osc.connect(gain).connect(audio.destination);osc.start(at);osc.stop(at+.18)})}catch{}}
function feedback(kind='tap'){vibration(kind);chime(kind)}function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2050)}
function move(to,direction){if(view===to)return;view=to;transition=direction;feedback();render();$('content').scrollTop=0}function render(){rollover();theme();const pane=$('pane'),content=$('content'),trash=view==='trash';pane.className='pane'+(transition?' swap-'+transition:'');transition='';$('heading').textContent=trash?'Rubble':view==='heap'?'Heap':DAYS[view];$('heading').classList.toggle('heap-heading',view==='heap');pane.querySelector('.heap-settings')?.remove();if(view==='heap'){const gear=document.createElement('button');gear.className='heap-settings';gear.setAttribute('aria-label','Settings');gear.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.7a1.7 1.7 0 0 0 .3 1.9l-1.6 2.7a1.7 1.7 0 0 0-1.8-.3l-1.3.7a1.7 1.7 0 0 0-1 1.4h-3.2a1.7 1.7 0 0 0-1-1.4l-1.3-.7a1.7 1.7 0 0 0-1.8.3l-1.6-2.7a1.7 1.7 0 0 0 .3-1.9v-1.4a1.7 1.7 0 0 0-1.1-1.5V7.6a1.7 1.7 0 0 0 1.8-.3L8 6.6a1.7 1.7 0 0 0 1-1.4h3.2a1.7 1.7 0 0 0 1 1.4l1.3.7a1.7 1.7 0 0 0 1.8-.3l1.6 2.7a1.7 1.7 0 0 0-.3 1.9z"/></svg>';gear.onclick=openSettings;pane.append(gear)}content.innerHTML='';content.classList.toggle('blank',!data.tasks.length);const items=trash?data.trash:data.tasks.filter(t=>t.day===view);if(trash){const pile=document.createElement('div');pile.className='trash-pile';pile.style.height=Math.max(540,Math.ceil(Math.min(items.length,80)/4)*100+400)+'px';items.slice(0,80).forEach((t,i)=>{const p=document.createElement('button');p.className='paper';p.style.setProperty('--left',`${5+(i*37%64)}%`);p.style.setProperty('--top',`${26+i*73}px`);p.style.setProperty('--width',`${41+(i%3)*4}%`);p.style.setProperty('--rot',`${((i*31)%32)-16}deg`);p.style.setProperty('--delay',`${Math.min(i*50,450)}ms`);p.textContent=t.title;const small=document.createElement('small');small.textContent='Tap to restore';p.append(small);p.onclick=()=>restore(t.id);pile.append(p)});content.append(pile)}else{items.forEach((t,i)=>{const item=document.createElement('div');item.className='task';item.tabI function finish(id,el){const index=data.tasks.findIndex(t=>t.id===id);if(index<0)return;const t=data.tasks.splice(index,1)[0];t.deletedAt=Date.now();data.trash.unshift(t);data.trash=data.trash.slice(0,80);save();feedback('finish');closeSheet();if(el&&el.isConnected&&data.settings.motion&&!matchMedia('(prefers-reduced-motion: reduce)').matches){el.classList.remove('holding');el.classList.add('disappear');for(let i=0;i<11;i++){const p=document.createElement('span');p.className='spark';p.style.cssText=`--x:${10+Math.random()*80}%;--y:${10+Math.random()*80}%;--size:${2+Math.random()*5}px;--dx:${(Math.random()-.5)*150}px;--dy:${(Math.random()-.5)*130}px`;el.append(p)}setTimeout(()=>{render();toast('Completed')},430)}else{render();toast('Completed')}}function restore(id){const idx=data.trash.findIndex(t=>t.id===id);if(idx<0)return;const t=data.trash.splice(idx,1)[0];delete t.deletedAt;data.tasks.push(t);save();feedback('create');render();toast('Restored')}
function taskHold(el,id){let timer=null,start=null,started=false,fired=false,cancelled=false;const reset=()=>{clearTimeout(timer);timer=null;el.classList.remove('holding')};el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;started=true;fired=false;cancelled=false;start=[e.clientX,e.clientY];reset();el.classList.add('holding');timer=setTimeout(()=>{fired=true;suppressClickUntil=Date.now()+650;reset();finish(id,el)},640)});el.addEventListener('pointermove',e=>{if(start&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>13){cancelled=true;reset()}});el.addEventListener('pointerup',()=>{reset()});el.addEventListener('pointercancel',()=>{cancelled=true;reset()});el.addEventListener('click',e=>{if(fired||cancelled||Date.now()<suppressClickUntil){e.preventDefault();return}if(started)openTask(id)});el.addEventListener('contextmenu',e=>e.preventDefault())}
function sheet(){closeSheet();const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML='<section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div><div class="sheet-header"><h2></h2><button class="x" aria-label="Close">×</button></div><div class="sheet-body"></div></section>';overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});overlay.querySelector('.x').onclick=closeSheet;document.body.append(overlay);modal=overlay;return{title:overlay.querySelector('h2'),body:overlay.querySelector('.sheet-body')}}function closeSheet(){modal?.remove();modal=null}function focusInput(input){setTimeout(()=>input?.focus(),230)}
function openCreate(){if(view==='trash'||modal)return;feedback('hold');const {title,body}=sheet();title.textContent='New task';body.innerHTML='<label for="newTitle">Title</label><input id="newTitle" type="text" maxlength="140" placeholder="What needs doing?"><label for="newDesc">Description · optional</label><textarea id="newDesc" maxlength="5000" placeholder="Add some detail…"></textarea><div class="actions"><button class="primary" id="newSave">Add task</button></div>';const add=()=>{const name=$('newTitle').value.trim();if(!name){$('newTitle').focus();return}data.tasks.push({id:makeId(),title:name,description:$('newDesc').value.trim(),day:view,createdAt:Date.now()});save();feedback('create');closeSheet();render();toast('Added')};$('newSave').onclick=add;$('newTitle').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});focusInput($('newTitle'))}
function dayChoices(t){const el=$('choices');el.hidden=!el.hidden;if(el.hidden)return;el.innerHTML='';[...DAYS,'Heap'].forEach((d,i)=>{const b=document.createElement('button');b.textContent=i===7?'Heap':d.slice(0,3);b.className=t.day===(i===7?'heap':i)?'active':'';b.onclick=()=>{t.day=i===7?'heap':i;save();feedback();closeSheet();render();toast('Moved to '+d)};el.append(b)})}
function openTask(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;feedback();const {title,body}=sheet();title.textContent=t.title;const p=document.createElement('p');p.className='description';p.textContent=t.description||'No description';body.append(p);const controls=document.createElement('div');controls.className='actions';controls.innerHTML='<button class="primary" id="tomorrow">Next day</button><button id="choose">Move to…</button><button id="edit">Edit</button><button class="danger" id="complete">Complete</button>';body.append(controls);const choices=document.createElement('div');choices.id='choices';choices.className='choices';choices.hidden=true;body.append(choices);$('tomorrow').onclick=()=>{t.day=(Number.isInteger(t.day)?t.day+1:today()+1)%7;save();feedback();closeSheet();render();toast('Moved to '+DAYS[t.day])};$('choose').onclick=()=>dayChoices(t);$('edit').onclick=()=>openEdit(id);$('complete').onclick=()=>finish(id)}
function openEdit(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;const {title,body}=sheet();title.textContent='Edit task';body.innerHTML='<label for="editTitle">Title</label><input id="editTitle" type="text" maxlength="140"><label for="editDesc">Description</label><textarea id="editDesc" maxlength="5000"></textarea><div class="actions"><button id="editSave" class="primary">Save</button><button id="editCancel">Cancel</button></div>';$('editTitle').value=t.title;$('editDesc').value=t.description||'';$('editSave').onclick=()=>{const name=$('editTitle').value.trim();if(!name){$('editTitle').focus();return}t.title=name;t.description=$('editDesc').value.trim();save();feedback();closeSheet();render();toast('Saved')};$('editCancel').onclick=()=>openTask(id);focusInput($('editTitle'))}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'emiliarity',version:3,exportedAt:new Date().toISOString(),tasks:data.tasks,trash:data.trash,settings:data.settings,lastDate:data.lastDate},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='emiliarity-backup-'+todayKey()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Backup exported')}
function importBackup(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!['drift','emiliarity'].includes(obj.app)||!Array.isArray(obj.tasks)||!Array.isArray(obj.trash))throw Error('Invalid backup');if(!confirm('Replace all existing tasks with this backup?'))return;const valid=t=>t&&typeof t.title==='string'&&t.title.trim()&&(t.day==='heap'||Number.isInteger(t.day)&&t.day>=0&&t.day<7);const clean=t=>({id:String(t.id||makeId()),title:t.title.slice(0,140),description:String(t.description||'').slice(0,5000),day:t.day,createdAt:t.createdAt||Date.now(),...(t.deletedAt?{deletedAt:t.deletedAt}:{})});data.tasks=obj.tasks.filter(valid).map(clean);data.trash=obj.trash.filter(valid).slice(0,80).map(clean);data.lastDate=fromKey(obj.lastDate)?obj.lastDate:todayKey();if(obj.settings&&typeof obj.settings==='object')data.settings=Object.assign(data.settings,obj.settings);save();rollover();closeSheet();view=today();render();toast('Backup restored')}catch{toast('Could not read backup')}};reader.readAsText(file)}
function openSettings(){const {title,body}=sheet();title.textContent='Settings';body.innerHTML='<label>Atmosphere</label><div class="themes"><button data-color="iridescent">Iridescent</button><button data-color="moon">Moon</button><button data-color="blue">Blue</button></div><div class="setting"><span>Darken background</span><input type="range" min="0" max="90" id="dim"></div><div class="setting"><span>Sounds</span><input id="sound" type="checkbox"></div><div class="setting"><span>Haptics</span><input id="haptics" type="checkbox"></div><div class="setting"><span>Motion</span><input id="motion" type="checkbox"></div><div class="actions"><button id="backup">Export backup</button><button id="restoreBackup">Import backup</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><p class="note">Hold empty space to add. Tap a task for details; hold it to complete. Swipe sideways between days, down to Heap, then down again for Rubble. Swipe up to return. At 4 am unfinished tasks from the previous day advance. Tasks are stored on this device — export backups occasionally.</p><div class="actions"><button id="done" class="primary">Done</button></div>';$('dim').value=data.settings.dim;for(const k of ['sound','haptics','motion'])$(k).checked=!!data.settings[k];$('dim').oninput=e=>{data.settings.dim=+e.target.value;save();theme()};for(const k of ['sound','haptics','motion'])$(k).onchange=e=>{data.settings[k]=e.target.checked;save();theme()};body.querySelectorAll('[data-color]').forEach(b=>{b.classList.toggle('selected',b.dataset.color===data.settings.theme);b.onclick=()=>{data.settings.theme=b.dataset.color;save();theme();body.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===b));feedback()}});$('backup').onclick=exportBackup;$('restoreBackup').onclick=()=>$('importFile').click();$('importFile').onchange=e=>importBackup(e.target.files[0]);$('done').onclick=closeSheet}
// Use pointer timers, explicit select suppression, and movement cancellation for reliable touch-and-hold.
const content=$('content');const clearBlank=()=>{clearTimeout(blankTimer);blankTimer=null;blankStart=null};content.addEventListener('pointerdown',e=>{if(modal||view==='trash'||e.target.closest('.task,button,.paper'))return;if(e.pointerType==='mouse'&&e.button!==0)return;clearBlank();blankStart=[e.clientX,e.clientY];blankTimer=setTimeout(()=>{suppressClickUntil=Date.now()+700;clearBlank();openCreate()},540)});content.addEventListener('pointermove',e=>{if(blankStart&&Math.hypot(e.clientX-blankStart[0],e.clientY-blankStart[1])>12)clearBlank()});content.addEventListener('pointerup',clearBlank);content.addEventListener('pointercancel',clearBlank);content.addEventListener('contextmenu',e=>e.preventDefault());content.addEventListener('selectstart',e=>e.preventDefault());
let gesture=null;const shell=$('shell');shell.addEventListener('touchstart',e=>{if(modal||e.target.closest('input,textarea,button'))return;const p=e.touches[0];gesture={x:p.clientX,y:p.clientY,scroll:content.scrollTop,time:Date.now()};},{passive:true});shell.addEventListener('touchmove',e=>{if(!gesture)return;const p=e.touches[0];if(Math.abs(p.clientY-gesture.y)>14||Math.abs(p.clientX-gesture.x)>14)clearBlank()},{passive:true});shell.addEventListener('touchend',e=>{if(!gesture||modal)return;const p=e.changedTouches[0],dx=p.clientX-gesture.x,dy=p.clientY-gesture.y;const atTop=gesture.scroll<6;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2){if(typeof view==='number')move((view+(dx<0?1:6))%7,dx<0?'left':'right')}else if(dy>65&&Math.abs(dy)>Math.abs(dx)*1.2&&atTop){if(view==='heap')move('trash','up');else if(typeof view==='number')move('heap','up')}else if(dy< -65&&Math.abs(dy)>Math.abs(dx)*1.2){if(view==='trash')move('heap','down');else if(view==='heap')move(today(),'down')}gesture=null},{passive:true});shell.addEventListener('touchcancel',()=>{gesture=null;clearBlank()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(modal)return;if(e.key==='ArrowLeft'&&typeof view==='number')move((view+1)%7,'left');if(e.key==='ArrowRight'&&typeof view==='number')move((view+6)%7,'right');if(e.key==='ArrowDown'&&typeof view==='number')move('heap','up');if(e.key==='ArrowUp'&&view==='heap')move(today(),'down');if(e.key==='n'&&!e.ctrlKey&&!e.metaKey)openCreate()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});setInterval(()=>{if(!document.hidden&&todayKey()!==data.lastDate)render()},60000);
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
