<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16131d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Emiliarity</title>
  <style>
    :root{
      color-scheme: dark;
      --dim:.34;
      --motion:1;
      --ink:#fcf7ff;
      --soft:#e7dbf0;
      --glass:rgba(255,255,255,.10);
      --edge:rgba(255,255,255,.22);
      --day-tone:rgba(255,255,255,.05);
      --heap-tone:rgba(10,12,20,.28);
      --trash-tone:rgba(5,6,12,.52);
      --accent1:#efa6d0;
      --accent2:#8fdcf0;
      --accent3:#c6b0ff;
      --stage-y:-200%;
    }
    [hidden]{display:none !important}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overscroll-behavior:none;background:#13111a}
    body{
      font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
      color:var(--ink);
      overflow:hidden;
      -webkit-tap-highlight-color:transparent;
    }
    button,input,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    button:focus-visible,[role=button]:focus-visible,input:focus-visible,textarea:focus-visible{
      outline:2px solid rgba(255,255,255,.95);
      outline-offset:2px;
    }

    .sky{
      position:fixed;
      inset:-12%;
      pointer-events:none;
      overflow:hidden;
      background:
        radial-gradient(ellipse at 10% 18%,#f4bfd8 0%,transparent 38%),
        radial-gradient(ellipse at 84% 18%,#9fe5f4 0%,transparent 34%),
        radial-gradient(ellipse at 44% 63%,#d8bef6 0%,transparent 43%),
        radial-gradient(ellipse at 82% 76%,#ffc4db 0%,transparent 34%),
        linear-gradient(145deg,#958eb8,#746d99 50%,#8183b1);
      filter:saturate(1.06);
    }
    .sky::before{
      content:"";
      position:absolute;
      inset:-10%;
      background:
        linear-gradient(16deg,transparent 25%,rgba(255,255,255,.54) 33%,rgba(255,255,255,0) 42%),
        linear-gradient(166deg,transparent 22%,rgba(170,234,255,.38) 30%,rgba(255,255,255,0) 40%),
        linear-gradient(153deg,transparent 18%,rgba(255,175,221,.34) 28%,rgba(255,255,255,0) 38%);
      filter:blur(22px);
      mix-blend-mode:screen;
      animation:float 18s ease-in-out infinite alternate;
    }
    .sky::after{content:"";position:absolute;inset:0;background:#090a11;opacity:var(--dim)}

    .shell{
      position:relative;
      max-width:700px;
      height:100dvh;
      margin:auto;
      overflow:hidden;
      isolation:isolate;
      touch-action:pan-x pan-y;
      user-select:none;
      -webkit-user-select:none;
    }
    .stage{
      position:absolute;
      inset:0;
      transform:translate3d(0,var(--stage-y),0);
      transition:transform .48s cubic-bezier(.18,.87,.22,1);
      will-change:transform;
    }
    .pane{
      position:absolute;
      left:0;right:0;
      height:100%;
      padding:calc(env(safe-area-inset-top) + 74px) 22px calc(env(safe-area-inset-bottom) + 18px);
      display:flex;
      flex-direction:column;
      gap:18px;
      min-height:0;
      overflow:hidden;
    }
    .pane::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .pane-day{top:200%;background:linear-gradient(180deg,rgba(255,255,255,.03),var(--day-tone))}
    .pane-heap{top:100%;background:linear-gradient(180deg,rgba(255,255,255,.02),var(--heap-tone))}
    .pane-trash{top:0%;background:linear-gradient(180deg,rgba(255,255,255,.015),var(--trash-tone))}

    .heading{
      position:relative;
      z-index:1;
      margin:0;
      font-size:clamp(56px,14vw,88px);
      font-weight:470;
      letter-spacing:-.09em;
      line-height:1.02;
      text-shadow:0 10px 28px rgba(57,40,82,.18);
      flex:none;
    }

    .content-wrap{position:relative;z-index:1;flex:1;min-height:0}
    .content{
      position:relative;
      height:100%;
      overflow-x:hidden;
      overflow-y:auto;
      scrollbar-width:none;
      overscroll-behavior:contain;
      padding:2px 2px calc(env(safe-area-inset-bottom) + 14px);
      touch-action:pan-y;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }
    .content::-webkit-scrollbar{display:none}
    .content.no-scroll{overflow-y:hidden}
    .content-list{display:grid;gap:10px;align-content:start;min-height:100%}

    .fade{
      position:absolute;
      left:0;right:0;height:32px;
      pointer-events:none;
      opacity:0;
      transition:opacity .18s ease;
      z-index:3;
    }
    .fade.show{opacity:1}
    .fade-top{top:0;background:linear-gradient(180deg,rgba(10,10,16,.56),rgba(10,10,16,0))}
    .fade-bottom{bottom:0;background:linear-gradient(0deg,rgba(10,10,16,.58),rgba(10,10,16,0))}
    .pane-heap .fade-top,.pane-heap .fade-bottom{background-image:linear-gradient(180deg,rgba(8,9,16,.74),rgba(8,9,16,0))}
    .pane-heap .fade-bottom{background-image:linear-gradient(0deg,rgba(8,9,16,.76),rgba(8,9,16,0))}
    .pane-trash .fade-top,.pane-trash .fade-bottom{background-image:linear-gradient(180deg,rgba(3,4,10,.86),rgba(3,4,10,0))}
    .pane-trash .fade-bottom{background-image:linear-gradient(0deg,rgba(3,4,10,.88),rgba(3,4,10,0))}

    .task{
      position:relative;
      min-height:64px;
      border:1px solid var(--edge);
      border-radius:24px;
      background:
        linear-gradient(130deg,rgba(255,255,255,.18),rgba(255,255,255,.07) 52%,rgba(255,255,255,.12)),
        radial-gradient(circle at 18% 25%,rgba(255,194,226,.18),transparent 32%),
        radial-gradient(circle at 84% 80%,rgba(149,231,255,.16),transparent 36%);
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.40),
        inset 0 -14px 28px rgba(255,255,255,.02),
        0 12px 28px rgba(31,24,48,.16),
        0 0 0 1px rgba(255,255,255,.03);
      backdrop-filter:blur(28px) saturate(1.35);
      -webkit-backdrop-filter:blur(28px) saturate(1.35);
      display:flex;
      align-items:center;
      gap:14px;
      padding:15px 18px;
      cursor:pointer;
      overflow:hidden;
      animation:materialize .32s ease both;
      touch-action:pan-y;
      -webkit-touch-callout:none;
    }
    .task::before{
      content:"";
      position:absolute;
      left:22px;right:22px;top:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent);
      pointer-events:none;
    }
    .task-badge{
      position:relative;
      width:24px;height:24px;
      border-radius:50%;
      flex:none;
      border:1px solid rgba(255,255,255,.38);
      background:
        linear-gradient(155deg,rgba(255,255,255,.30),rgba(255,255,255,.10)),
        radial-gradient(circle at 72% 72%,rgba(121,225,255,.45),transparent 38%),
        radial-gradient(circle at 28% 28%,rgba(255,171,220,.46),transparent 34%),
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.08),rgba(255,255,255,.02));
      box-shadow:
        inset 0 1px 1px rgba(255,255,255,.55),
        inset 0 -6px 12px rgba(129,205,255,.16),
        0 6px 14px rgba(86,59,126,.20);
      backdrop-filter:blur(16px) saturate(1.5);
      -webkit-backdrop-filter:blur(16px) saturate(1.5);
    }
    .task-badge::before{
      content:"";
      position:absolute;
      top:3px;left:4px;right:9px;height:7px;
      border-radius:999px;
      background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,0));
      transform:rotate(-14deg);
    }
    .task-name{font-size:16px;font-weight:510;line-height:1.42;overflow-wrap:anywhere;pointer-events:none}
    .progress{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.32),rgba(255,255,255,.08));transform:scaleX(0);transform-origin:left;pointer-events:none}
    .task.holding .progress{display:none}
    .task.disappear{animation:pop .42s cubic-bezier(.3,.8,.2,1) forwards}
    .task .spark{position:absolute;width:var(--size);height:var(--size);left:var(--x);top:var(--y);background:#fff;border-radius:50%;pointer-events:none;animation:spark .46s ease-out forwards}

    .trash-pile{position:relative;min-height:100%}
    .paper{
      position:absolute;
      top:var(--top);left:var(--left);
      width:var(--width);
      min-height:78px;
      border:1px solid rgba(255,255,255,.44);
      background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
      border-radius:9px 14px 8px 13px;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:0 12px 28px rgba(8,8,14,.50), inset 0 1px rgba(255,255,255,.34);
      color:#fff;
      padding:14px 15px;
      transform:rotate(var(--rot));
      animation:paperfall .7s cubic-bezier(.1,.78,.2,1) both;
      animation-delay:var(--delay);
      overflow-wrap:anywhere;
      text-align:left;
    }
    .paper small{display:block;margin-top:8px;font-size:11px;opacity:.7}

    .heap-settings{
      position:absolute;
      top:calc(env(safe-area-inset-top) + 22px);
      right:22px;
      z-index:2;
      height:42px;width:42px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.26);
      background:rgba(255,255,255,.10);
      box-shadow:inset 0 1px rgba(255,255,255,.35),0 10px 22px rgba(8,10,20,.18);
      backdrop-filter:blur(22px) saturate(1.2);
      -webkit-backdrop-filter:blur(22px) saturate(1.2);
      display:grid;place-items:center;
    }
    .heap-settings svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

    .overlay{
      position:fixed;
      inset:0;
      z-index:30;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      background:rgba(7,8,14,.58);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      animation:fade .2s ease;
    }
    .sheet{
      width:100%;max-width:700px;max-height:92dvh;overflow:auto;
      padding:12px 22px calc(env(safe-area-inset-bottom) + 26px);
      border-radius:30px 30px 0 0;
      border:1px solid rgba(255,255,255,.40);
      background:
        linear-gradient(155deg,rgba(118,104,150,.96),rgba(44,37,67,.97) 54%,rgba(24,22,36,.98)),
        radial-gradient(circle at 18% 14%,rgba(244,191,216,.14),transparent 22%),
        radial-gradient(circle at 82% 72%,rgba(159,229,244,.13),transparent 26%);
      box-shadow:0 -18px 70px rgba(10,9,20,.45), inset 0 1px rgba(255,255,255,.48);
      animation:sheetup .34s cubic-bezier(.16,1,.3,1);
    }
    .handle{height:4px;width:40px;margin:0 auto 18px;border-radius:999px;background:rgba(255,255,255,.55)}
    .sheet-header{display:flex;align-items:start;justify-content:space-between;gap:12px}
    .sheet h2{margin:6px 0 18px;font-size:26px;font-weight:530;letter-spacing:-.045em}
    .x{border:0;background:none;font-size:28px;line-height:1;padding:4px 2px}
    .sheet label{display:block;margin:16px 0 8px;font-size:12px;opacity:.82}
    .sheet input[type=text], .sheet textarea{
      width:100%;display:block;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.33);
      border-radius:18px;
      padding:14px 15px;
      outline:none;
      color:#fff;
      user-select:text;
      -webkit-user-select:text;
    }
    .sheet input::placeholder,.sheet textarea::placeholder{color:rgba(246,240,255,.64)}
    .sheet textarea{min-height:104px;resize:vertical;line-height:1.6}
    .detail-title{
      font-size:28px;font-weight:550;letter-spacing:-.04em;
      background:transparent !important;border:0 !important;padding:0 0 4px !important;border-radius:0 !important;
    }
    .detail-desc{
      margin-top:10px;
      min-height:132px !important;
      background:rgba(255,255,255,.09) !important;
    }
    .icon-actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
    .icon-btn{
      height:48px;width:48px;display:grid;place-items:center;flex:none;
      border-radius:18px;border:1px solid rgba(255,255,255,.26);
      background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.07));
      box-shadow:inset 0 1px rgba(255,255,255,.35),0 10px 20px rgba(14,10,24,.16);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }
    .icon-btn svg{width:20px;height:20px;fill:none;stroke:white;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
    .icon-btn.danger{background:linear-gradient(145deg,rgba(227,111,149,.22),rgba(124,51,75,.20))}
    .choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:15px 0 6px}
    .choices button,.themes button,.actions button{
      border:1px solid rgba(255,255,255,.28);
      border-radius:16px;
      background:rgba(255,255,255,.12);
      color:inherit;
      padding:12px 10px;
    }
    .choices button.active,.actions .primary{background:rgba(255,255,255,.86);color:#2e2544;border-color:#fff}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    .themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .themes button{height:54px}
    .themes .selected{outline:2px solid #fff;outline-offset:-3px}
    .themes [data-color=iridescent]{background:linear-gradient(120deg,#d7c6f0,#f5bfd9,#9fe4f3)}
    .themes [data-color=moon]{background:linear-gradient(120deg,#5c5588,#9c91bb,#72639c)}
    .themes [data-color=blue]{background:linear-gradient(120deg,#41779a,#73bfd1,#8f9fd0)}
    .setting{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:20px 0;font-size:14px}
    .setting input[type=range]{width:52%;accent-color:#f1d7ff}
    .setting input[type=checkbox]{width:20px;height:20px;accent-color:#ebc2ff}
    .note{font-size:12px;line-height:1.65;opacity:.8}

    .toast{
      position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:50;
      transform:translate(-50%,15px);
      max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      background:rgba(32,26,48,.82);color:#fff;padding:10px 16px;border-radius:999px;
      border:1px solid rgba(255,255,255,.26);
      backdrop-filter:blur(18px);
      font-size:12px;opacity:0;pointer-events:none;
      transition:opacity .24s,transform .24s;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    .day-animate-left{animation:slideFromRight .35s cubic-bezier(.19,.84,.24,1)}
    .day-animate-right{animation:slideFromLeft .35s cubic-bezier(.19,.84,.24,1)}

    @keyframes float{to{transform:translate3d(6%,4%,0) rotate(10deg)}}
    @keyframes materialize{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
    @keyframes holdfill{to{transform:scaleX(1)}}
    @keyframes pop{0%{opacity:1;transform:scale(1);filter:blur(0)}55%{opacity:.85;transform:scale(1.035)}100%{opacity:0;transform:scale(.76) translateY(-18px);filter:blur(9px)}}
    @keyframes spark{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15)}}
    @keyframes paperfall{from{opacity:0;transform:translateY(-220px) rotate(calc(var(--rot) * -1))}to{opacity:1;transform:rotate(var(--rot))}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes slideFromRight{from{opacity:.35;transform:translateX(18%)}to{opacity:1;transform:none}}
    @keyframes slideFromLeft{from{opacity:.35;transform:translateX(-18%)}to{opacity:1;transform:none}}

    .no-motion *{animation:none !important;transition:none !important}

/* v0.5: clear glass, layered task heap and soft animated colour */
.sky{animation:skyBreathe 28s ease-in-out infinite alternate}
.sky::before{animation:float 27s ease-in-out infinite alternate}
@keyframes skyBreathe{0%{filter:saturate(1.02) hue-rotate(-7deg);transform:scale(1)}50%{filter:saturate(1.12) hue-rotate(5deg);transform:scale(1.045) translateX(1%)}100%{filter:saturate(1.03) hue-rotate(-4deg);transform:scale(1.025) translateY(-1%)}}
.task{background:linear-gradient(128deg,rgba(255,255,255,.10),rgba(255,255,255,.025) 54%,rgba(255,255,255,.075)),radial-gradient(circle at 10% 0%,rgba(255,195,226,.15),transparent 40%),radial-gradient(circle at 92% 100%,rgba(137,234,255,.14),transparent 35%);border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px rgba(255,255,255,.55),inset 0 -1px rgba(255,255,255,.12);backdrop-filter:blur(9px) saturate(1.34);-webkit-backdrop-filter:blur(9px) saturate(1.34)}
.task-badge{display:none}
.task::after{content:"";position:absolute;pointer-events:none;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 18%,rgba(255,255,255,.065) 42%,transparent 62%)}
.task-name{position:relative;z-index:1}
.pane-heap{background:linear-gradient(180deg,rgba(11,12,23,.16),rgba(5,8,17,.43))}
.pane-trash{background:linear-gradient(180deg,rgba(3,5,10,.42),rgba(2,3,8,.73))}
.fade{height:18px}
.fade-top{background:linear-gradient(180deg,rgba(13,13,19,.19),transparent)}
.fade-bottom{background:linear-gradient(0deg,rgba(13,13,19,.25),transparent)}
.heap-pile{position:relative;min-height:100%;width:100%;padding-bottom:10px}
.heap-slip{position:absolute;min-height:64px;width:var(--pile-width);left:var(--pile-left);top:var(--pile-top);z-index:var(--pile-z);transform:rotate(var(--pile-rot));animation:heapLand .5s cubic-bezier(.18,1.22,.35,1) both;animation-delay:var(--pile-delay);border-radius:20px;max-width:92%;padding:14px 16px;overflow-wrap:anywhere}
.heap-slip:active{transform:rotate(var(--pile-rot)) scale(.99)}
.heap-slip .task-name{font-size:15px}
.heap-slip.completed{border-color:rgba(216,246,238,.49)}
@keyframes heapLand{from{opacity:0;translate:0 -70px;scale:.97}to{opacity:1;translate:0 0;scale:1}}
.task.disappear{animation:oomph .47s cubic-bezier(.18,.7,.2,1) forwards}
@keyframes oomph{0%{opacity:1;transform:scale(1);filter:blur(0)}20%{opacity:1;transform:scale(.94)}43%{opacity:1;transform:scale(1.13);filter:brightness(1.7)}100%{opacity:0;transform:scale(.28) rotate(-12deg);filter:blur(12px)}}
.task .spark{background:var(--spark-color,#fff);box-shadow:0 0 7px var(--spark-color,#fff)}
.detail-title,.detail-desc{cursor:text}
.sheet-header:has(h2:empty) h2{display:none}
.sheet-header:has(h2:empty){margin-bottom:12px}
.setting input[type=color]{width:56px;height:38px;padding:3px;border-radius:12px;border:1px solid #ffffff66;background:#ffffff25}
.no-motion .sky{animation:none!important}


/* v0.6 — bubblegum glow, independent Todo and Heap, creation bloom */
:root{--heap-tone:rgba(24,14,43,.20);--trash-tone:rgba(15,9,26,.36)}
.sky{animation:chromaticWander 13s ease-in-out infinite alternate!important;transform-origin:50% 50%;filter:saturate(1.30)}
.sky::before{animation:prismSlide 9s ease-in-out infinite alternate!important;filter:blur(13px)}
@keyframes chromaticWander{0%{transform:scale(1.03) translate(-3%,-3%);filter:hue-rotate(-12deg) saturate(1.23)}48%{transform:scale(1.10) translate(4%,2%);filter:hue-rotate(14deg) saturate(1.58)}100%{transform:scale(1.06) translate(-2%,5%);filter:hue-rotate(-8deg) saturate(1.35)}}
@keyframes prismSlide{0%{transform:translate(-7%,-3%) rotate(-7deg) scale(1.05)}100%{transform:translate(8%,5%) rotate(9deg) scale(1.16)}}
.task{border:1px solid rgba(255,255,255,.59);border-radius:29px;background:radial-gradient(ellipse at 14% 0%,rgba(255,225,241,.38),transparent 55%),radial-gradient(ellipse at 90% 92%,rgba(132,220,250,.32),transparent 52%),linear-gradient(122deg,rgba(255,209,233,.24),rgba(174,164,252,.11) 58%,rgba(129,230,246,.22));box-shadow:inset 0 1.5px rgba(255,255,255,.75),inset 0 -2px rgba(255,217,244,.22);backdrop-filter:blur(15px) saturate(1.9);-webkit-backdrop-filter:blur(15px) saturate(1.9)}
.task::after{background:linear-gradient(116deg,transparent 18%,rgba(255,255,255,.16) 35%,rgba(255,255,255,0) 49%)}
.pane-heap{background:linear-gradient(180deg,rgba(29,13,57,.08),rgba(12,9,30,.3))}
.pane-trash{background:linear-gradient(180deg,rgba(19,8,34,.16),rgba(9,6,23,.49))}
.rubble-mound{position:relative;width:100%;min-height:340px;isolation:isolate}
.rubble-mound:before{content:"";position:absolute;left:3%;right:3%;bottom:4px;height:28px;border-radius:50%;background:rgba(13,9,27,.22);filter:blur(17px)}

<body>
  <div class="bg-photo" id="bgPhoto"></div>
  <div class="sky" id="sky"></div>
  <main class="shell" id="shell">
    <div class="stage" id="stage">
      <section class="pane pane-trash">
        <h1 class="heading">Heap</h1>
        <div class="content-wrap">
          <div class="fade fade-top" id="trashFadeTop"></div>
          <div class="fade fade-bottom" id="trashFadeBottom"></div>
          <div class="content" id="trashContent"><div class="content-list" id="trashList"></div></div>
        </div>
      </section>

      <section class="pane pane-heap">
        <button class="heap-settings" id="heapSettings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19 13.7a1.7 1.7 0 0 0 .3 1.9l-1.6 2.7a1.7 1.7 0 0 0-1.8-.3l-1.3.7a1.7 1.7 0 0 0-1 1.4h-3.2a1.7 1.7 0 0 0-1-1.4l-1.3-.7a1.7 1.7 0 0 0-1.8.3l-1.6-2.7a1.7 1.7 0 0 0 .3-1.9v-1.4a1.7 1.7 0 0 0-1.1-1.5V7.6a1.7 1.7 0 0 0 1.8-.3L8 6.6a1.7 1.7 0 0 0 1-1.4h3.2a1.7 1.7 0 0 0 1 1.4l1.3.7a1.7 1.7 0 0 0 1.8-.3l1.6 2.7a1.7 1.7 0 0 0-.3 1.9z"></path></svg>
        </button>
        <h1 class="heading">Todo</h1>
        <div class="content-wrap">
          <div class="fade fade-top" id="heapFadeTop"></div>
          <div class="fade fade-bottom" id="heapFadeBottom"></div>
          <div class="content" id="heapContent"><div class="content-list" id="heapList"></div></div>
        </div>
      </section>

      <section class="pane pane-day">
        <h1 class="heading" id="dayHeading">Monday</h1>
        <div class="content-wrap" id="dayWrap">
          <div class="fade fade-top" id="dayFadeTop"></div>
          <div class="fade fade-bottom" id="dayFadeBottom"></div>
          <div class="content" id="dayContent"><div class="content-list" id="dayList"></div></div>
        </div>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="peek" id="peek"><img src="./emilia-peek.png" alt="" draggable="false"></div>
  <div class="top-peek" id="topPeek"><img src="./emilia-top.png" alt="" draggable="false"></div>

  <script>
  (() => {
    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const KEY = 'drift-v1';
    const $ = id => document.getElementById(id);
    const makeId = () => crypto.randomUUID?.() || Date.now() + '-' + Math.random().toString(36).slice(2);
    const logic = () => { const d = new Date(); d.setHours(d.getHours() - 4); return d; };
    const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const todayKey = () => dateKey(logic());
    const weekday = d => (d.getDay() + 6) % 7;
    const today = () => weekday(logic());
    const fromKey = s => {
      const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || '');
      if (!m) return null;
      const d = new Date(+m[1], +m[2]-1, +m[3], 12);
      return dateKey(d) === s ? d : null;
    };

    let data;
    try { data = JSON.parse(localStorage.getItem(KEY)); } catch {}
    if (!data || !Array.isArray(data.tasks)) data = { tasks: [], trash: [], settings: {}, lastDate: todayKey() };
    data.trash = Array.isArray(data.trash) ? data.trash : [];
    data.settings = Object.assign({ sound:true, haptics:true, dim:34, theme:'iridescent', motion:true, colors:null }, data.settings);
    if (!['iridescent','moon','blue','dark','light'].includes(data.settings.theme)) data.settings.theme = 'iridescent';
    data.settings.gradientOpacity ??= 72;
    data.settings.backgroundImage ??= null;
    data.settings.backgroundBlur ??= 0;
    data.settings.heapDecayDays ??= 7;
    data.tasks = data.tasks.filter(t => t && typeof t.title === 'string' && t.title.trim() && (t.day === 'heap' || Number.isInteger(t.day) && t.day >= 0 && t.day < 7));
    data.trash = data.trash.filter(t => t && typeof t.title === 'string' && t.title.trim());
    data.completed = Array.isArray(data.completed) ? data.completed : [];
    data.completed = data.completed.filter(t => t && typeof t.title === 'string' && t.title.trim());

    let currentDay = today();
    let surface = 'day'; // day | heap | trash
    let modal = null;
    let toastTimer = null;
    let audio = null;
    let blankTimer = null;
    let blankStart = null;
    let suppressClickUntil = 0;
    let dayAnim = '';
    let gesture = null;
    let activeDetailCommit = null;

    function save(){
      try { localStorage.setItem(KEY, JSON.stringify(data)); }
      catch { toast('Storage unavailable — export a backup'); }
    }

    function cleanExpired(){
      const days=Number(data.settings.heapDecayDays);
      if(!Number.isFinite(days) || days<=0) return;
      const oldest=Date.now()-days*86400000;
      const prev=data.completed.length;
      data.completed=data.completed.filter(t=>!t.completedAt || Number(t.completedAt)>oldest);
      if(data.completed.length!==prev) save();
    }

    function rollover(){
      const now = todayKey();
      if (data.lastDate === now) return;
      const old = fromKey(data.lastDate), next = fromKey(now);
      if (!old || !next) { data.lastDate = now; save(); return; }
      const elapsed = Math.round((next - old) / 86400000);
      if (elapsed <= 0) { data.lastDate = now; save(); return; }
      if (elapsed > 7) {
        for (const t of data.tasks) if (Number.isInteger(t.day)) t.day = today();
      } else {
        for (let i=0;i<elapsed;i++){
          const d = new Date(old); d.setDate(d.getDate()+i);
          const prev = weekday(d), following = (prev + 1) % 7;
          for (const t of data.tasks) if (t.day === prev) t.day = following;
        }
      }
      data.lastDate = now;
      save();
    }

    function theme(){
      const palettes = {
        iridescent:['#f4bfd8','#9fe5f4','#d8bef6','#ffc4db','#958eb8','#746d99','#8183b1'],
        moon:['#7e75aa','#b7add4','#a381be','#9b8bbb','#625b8e','#463d68','#655987'],
        blue:['#8ec4dd','#74a7d7','#d6badf','#afc6e8','#52749a','#41567c','#6786af'],
        dark:['#2a243a','#4c3d68','#293244','#30334a','#1d1a2c','#1e2035','#252237'],
        light:['#fff9fc','#e9f3ff','#f3e8fc','#fff7f9','#eceafa','#e4eeff','#f6e9f3']
      };
      const defaultPalette = palettes[data.settings.theme] || palettes.iridescent;
      const userColors = data.settings.colors;
      const validColor = c => typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c);
      const colors = Array.isArray(userColors) && userColors.length === 3 && userColors.every(validColor)
        ? [userColors[0],userColors[1],userColors[2],userColors[0],userColors[2],userColors[1],userColors[0]]
        : defaultPalette;
      const light=data.settings.theme==='light';
      document.documentElement.style.setProperty('--ink',light?'#342747':'#fcf7ff');
      const dark=data.settings.theme==='dark';
      const menuPalettes={iridescent:['rgba(244,194,223,.93)','rgba(159,213,245,.93)','rgba(188,166,234,.95)'],moon:['rgba(151,137,190,.96)','rgba(100,91,149,.97)','rgba(121,103,157,.97)'],blue:['rgba(149,211,236,.94)','rgba(129,183,224,.96)','rgba(159,166,224,.97)'],dark:['rgba(65,61,87,.97)','rgba(42,43,65,.98)','rgba(63,52,83,.98)'],light:['rgba(255,250,255,.97)','rgba(231,245,255,.97)','rgba(240,232,253,.97)']};
      const menuColors=menuPalettes[data.settings.theme]||menuPalettes.iridescent;
      document.documentElement.style.setProperty('--menu-a',menuColors[0]);
      document.documentElement.style.setProperty('--menu-b',menuColors[1]);
      document.documentElement.style.setProperty('--menu-c',menuColors[2]);
      document.documentElement.style.setProperty('--menu-ink',dark||data.settings.theme==='moon'?'#faf5ff':'#302544');
      document.documentElement.style.setProperty('--menu-input',dark||data.settings.theme==='moon'?'rgba(255,255,255,.13)':'rgba(255,255,255,.24)');
      const hasPhoto=!!data.settings.backgroundImage;
      const blur=Math.max(0,Math.min(32,+data.settings.backgroundBlur||0));
      document.documentElement.style.setProperty('--photo-blur',blur+'px');
      document.documentElement.style.setProperty('--photo-scale',String(1+blur/180));
      const image=$('bgPhoto');
      image.style.backgroundImage=hasPhoto?`url(${JSON.stringify(data.settings.backgroundImage)})`:'none';
      image.style.opacity=hasPhoto?'1':'0';
      document.documentElement.style.setProperty('--gradient-opacity',hasPhoto?String((Math.max(0,Math.min(100,+data.settings.gradientOpacity||0)))/100):'1');
      $('sky').style.background = `radial-gradient(ellipse at 10% 18%,${colors[0]} 0%,transparent 38%),radial-gradient(ellipse at 84% 18%,${colors[1]} 0%,transparent 34%),radial-gradient(ellipse at 44% 63%,${colors[2]} 0%,transparent 43%),radial-gradient(ellipse at 82% 76%,${colors[3]} 0%,transparent 34%),linear-gradient(145deg,${colors[4]},${colors[5]} 50%,${colors[6]})`;
      document.documentElement.style.setProperty('--dim',(Math.max(0,Math.min(90,+data.settings.dim||0))/100).toString());
      document.body.classList.toggle('no-motion',!data.settings.motion);
    }

    function vibration(kind){
      if (!data.settings.haptics) return;
      try { navigator.vibrate?.(kind === 'finish' ? [18,22,26] : kind === 'create-open' ? [13,32,20] : kind === 'hold' ? 18 : 8); } catch {}
    }
    function chime(kind='tap'){
      if (!data.settings.sound) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audio ||= new AC();
        if (audio.state === 'suspended') audio.resume();
        const tones = kind === 'finish' ? [510,360,225] : kind === 'create' ? [465,690] : [480];
        tones.forEach((hz, i) => {
          const osc = audio.createOscillator(), gain = audio.createGain(), at = audio.currentTime + i * .052;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(hz, at);
          osc.frequency.exponentialRampToValueAtTime(hz * .8, at + .13);
          gain.gain.setValueAtTime(.0001, at);
          gain.gain.exponentialRampToValueAtTime(.03, at + .009);
          gain.gain.exponentialRampToValueAtTime(.0001, at + .17);
          osc.connect(gain).connect(audio.destination);
          osc.start(at); osc.stop(at + .18);
        });
      } catch {}
    }
    function feedback(kind='tap'){ vibration(kind); chime(kind); }

    function toast(message){
      $('toast').textContent = message;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2050);
    }

    function stageIndex(){ return surface === 'trash' ? 0 : surface === 'heap' ? 1 : 2; }

    function scrollerForSurface(name){
      return name === 'day' ? $('dayContent') : name === 'heap' ? $('heapContent') : $('trashContent');
    }

      document.documentElement.style.setProperty('--stage-y', `${-stageIndex()*100}%`);

    function moveVertical(to){
      if (surface === to) return;
      surface = to;

      updateStage();
    }

    function moveDay(to, direction){
      if(surface!=='day') return;
      const pane=document.querySelector('.pane-day');
      const oldPane=pane.cloneNode(true);
      oldPane.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
      oldPane.classList.add('day-pane-ghost');
      oldPane.querySelectorAll('.task').forEach(t=>{t.style.animation='none';});
      oldPane.querySelectorAll('[tabindex]').forEach(el=>el.removeAttribute('tabindex'));
      $('shell').append(oldPane);
      currentDay=((to%7)+7)%7;
      dayAnim='';
      feedback();
      $('dayContent').scrollTop=0;
      renderDay();
      const x=direction==='left'?-1:1;
      const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches||!data.settings.motion;
      if(reduce){oldPane.remove();return;}
      const opts={duration:305,easing:'cubic-bezier(.22,.86,.25,1)',fill:'both'};
      const exit=oldPane.animate([{transform:'translateX(0)',opacity:1},{transform:`translateX(${x*100}%)`,opacity:.58}],opts);
      pane.animate([{transform:`translateX(${-x*100}%)`,opacity:.58},{transform:'translateX(0)',opacity:1}],opts);
      exit.onfinish=()=>oldPane.remove();
      exit.oncancel=()=>oldPane.remove();
    }

    function taskCard(task, i){
      const item = document.createElement('div');
      item.className = 'task';
      item.tabIndex = 0;
      item.setAttribute('role','button');
      item.setAttribute('aria-label', `${task.title}. Tap for details, hold to complete.`);
      item.style.animationDelay = Math.min(70, i*12) + 'ms';
      item.innerHTML = '<span class="progress"></span><span class="task-name"></span>';
      item.querySelector('.task-name').textContent = task.title;
      if (task.isCompleted) {
        item.addEventListener('click',()=>task.isLegacy?restore(task.id):openCompleted(task.id));
      } else taskHold(item, task.id);
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); (task.isLegacy ? restore(task.id) : task.isCompleted ? openCompleted(task.id) : openTask(task.id)); }
      });
      return item;
    }

    function renderTaskList(target, tasks){
      target.innerHTML = '';
      tasks.forEach((t, i) => target.append(taskCard(t, i)));
    }

    // Upper panels fill vertically first, then add a horizontally scrollable column.
    function columnRows(scroller){
      return Math.max(1, Math.floor((scroller.clientHeight - 18) / 78));
    }
    function renderColumns(scroller, list, tasks, kind){
      list.innerHTML='';
      list.className='content-list column-list';
      list.style.gridTemplateRows=`repeat(${columnRows(scroller)}, 68px)`;
      tasks.forEach((task,i)=>{
        const card=taskCard(task,i);
        if(kind==='completed'){
          card.classList.add('completed-card');
          // taskCard uses isCompleted to open the completed-task controls.
        }
        list.append(card);
      });
      requestAnimationFrame(syncAllFades);
    }
    function renderTrash(){
      const completed=[...data.completed].reverse().map(t=>({...t,isCompleted:true}));
      const legacy=[...data.trash].reverse().map(t=>({...t,isCompleted:true,isLegacy:true}));
      const all=[...completed,...legacy];
      const scroller=$('trashContent');
      renderColumns(scroller,$('trashList'),all,'completed');
    }
    function renderHeap(){
      renderColumns($('heapContent'),$('heapList'),data.tasks.filter(t=>t.day==='heap'),'todo');
    }

    function renderDay(){
      $('dayHeading').textContent = DAYS[currentDay];
      const list = $('dayList');
      list.className = 'content-list ' + (dayAnim ? `day-animate-${dayAnim}` : '');
      renderTaskList(list, data.tasks.filter(t => t.day === currentDay));
      if (dayAnim) setTimeout(() => { list.className = 'content-list'; dayAnim = ''; }, 360);
      syncFades($('dayContent'), $('dayFadeTop'), $('dayFadeBottom'));
    }

    function render(){
      rollover();
      cleanExpired();
      theme();
      renderTrash();
      renderHeap();
      renderDay();
      updateStage();
    }

    function finish(id, el){
      const index=data.tasks.findIndex(t=>t.id===id);
      if(index<0)return;
      const animate=!!(el && el.isConnected && data.settings.motion && !matchMedia('(prefers-reduced-motion: reduce)').matches);
      const rect=animate?el.getBoundingClientRect():null;
      if(animate){
        // The effect is drawn outside the scrolling pane so no edge can clip it.
        const ghost=el.cloneNode(true);
        ghost.className='task bubble-ghost';
        ghost.removeAttribute('tabindex');ghost.removeAttribute('role');
        Object.assign(ghost.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',animationDelay:'0ms'});
        document.body.append(ghost);
        ghost.addEventListener('animationend',()=>ghost.remove(),{once:true});
        setTimeout(()=>ghost.remove(),450);
        const colors=['#fff','#e7b7f5','#8ce8ed','#ffc9df','#b7afff'];
        for(let i=0;i<19;i++){
          const particle=document.createElement('i');
          const theta=Math.PI*2*i/19+(Math.random()-.5)*.4;
          const travel=48+Math.random()*115;
          particle.className='pop-particle';
          particle.style.cssText=`left:${rect.left+rect.width*(.28+Math.random()*.44)}px;top:${rect.top+rect.height*(.24+Math.random()*.52)}px;--dx:${Math.cos(theta)*travel}px;--dy:${Math.sin(theta)*travel}px;--size:${3+Math.random()*7}px;--spark-color:${colors[i%colors.length]}`;
          document.body.append(particle);
          particle.addEventListener('animationend',()=>particle.remove(),{once:true});
          setTimeout(()=>particle.remove(),500);
        }
      }
      const t=data.tasks.splice(index,1)[0];
      t.completedAt=Date.now();data.completed.push(t);save();feedback('finish');closeSheet();
      render();toast('Completed · added to Heap');
    }
    function deleteForever(id,completed=false){
      if(!confirm('Delete this task permanently? This cannot be undone.')) return;
      const arr=completed?data.completed:data.tasks;
      const idx=arr.findIndex(t=>t.id===id);
      if(idx<0)return;
      arr.splice(idx,1);save();feedback('finish');closeSheet();render();toast('Permanently deleted');
    }
    function openCompleted(id){
      const task=data.completed.find(t=>t.id===id);
      if(!task)return;
      const {body}=sheet('');
      body.innerHTML='<div class="description" id="doneTitle" style="font-size:24px;font-weight:550;margin-bottom:12px"></div><div class="description" id="doneDesc"></div><div class="icon-actions"><button class="icon-btn" id="undoComplete" aria-label="Restore to original day" title="Restore"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button><button class="icon-btn danger" id="deleteCompleted" aria-label="Delete permanently" title="Delete permanently"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg></button></div>';
      $('doneTitle').textContent=task.title;
      $('doneDesc').textContent=task.description||'';
      $('undoComplete').onclick=()=>{const idx=data.completed.findIndex(t=>t.id===id);if(idx<0)return;const item=data.completed.splice(idx,1)[0];delete item.completedAt;data.tasks.push(item);save();feedback();closeSheet();render();toast('Restored')};
      $('deleteCompleted').onclick=()=>deleteForever(id,true);
    }

    function restore(id){
      const idx = data.trash.findIndex(t => t.id === id);
      if (idx < 0) return;
      const t = data.trash.splice(idx, 1)[0];
      delete t.deletedAt;
      data.tasks.push(t);
      save();
      feedback('create');
      render();
      toast('Restored');
    }

    function taskHold(el, id){
      let timer = null, start = null, fired = false, cancelled = false;
      const reset = () => { clearTimeout(timer); timer = null; el.classList.remove('holding'); };
      el.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        fired = false; cancelled = false;
        start = [e.clientX, e.clientY];
        reset();
        el.classList.add('holding');
        timer = setTimeout(() => {
          fired = true;
          suppressClickUntil = Date.now() + 180;
          reset();
          finish(id, el);
        }, 510);
      });
      el.addEventListener('pointermove', e => {
        if (start && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 13) { cancelled = true; reset(); }
      });
      let touchOpened = false;
      el.addEventListener('pointerup', e => {
        const tapped=!!start && !fired && !cancelled && Math.hypot(e.clientX-start[0],e.clientY-start[1])<13;
        reset();
        if (tapped && e.pointerType==='touch') {
          touchOpened=true;
          openTask(id); // Don't depend on a delayed synthetic click on Android.
        }
      });
      el.addEventListener('pointercancel', () => { cancelled = true; reset(); });
      el.addEventListener('click', e => {
        if(touchOpened){touchOpened=false;e.preventDefault();return;}
        if (fired || cancelled || Date.now() < suppressClickUntil) { e.preventDefault(); return; }
        openTask(id);
      });
      el.addEventListener('contextmenu', e => e.preventDefault());
    }

    function sheet(titleText,isCreate=false){
      closeSheet();
      theme(); // Apply the active atmosphere before the modal is inserted.
      const overlay = document.createElement('div');
      overlay.className = 'overlay'+(isCreate?' overlay-create':'');
      overlay.innerHTML = '<section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div><div class="sheet-header"><h2></h2><button class="x" aria-label="Close">×</button></div><div class="sheet-body"></div></section>';
      overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });
      overlay.querySelector('.x').onclick = closeSheet;
      overlay.querySelector('h2').textContent = titleText;
      document.body.append(overlay);
      modal = overlay;
      return { title: overlay.querySelector('h2'), body: overlay.querySelector('.sheet-body') };
    }

    function closeSheet(){
      try { activeDetailCommit?.(); } catch {}

      modal?.remove();

    function focusInput(input){ setTimeout(() => input?.focus(), 230); }

    function openCreate(){
      if (surface === 'trash' || modal) return;

      let adding=false;
      const add = () => {

        const name = $('newTitle').value.trim();
        if (!name) { $('newTitle').focus(); return; }
        adding=true;

        save(); feedback('create'); closeSheet(); render(); toast('Added');
      };
      $('newSave').onclick = add;
      $('newTitle').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } });

    function dayChoices(task, hostId='choices'){

      body.innerHTML = `

        const desc = descEl.value.trim();

      $('complete').onclick = () => { commit(); finish(id); };

      // Do not focus an editor unless the user explicitly taps it.

    }

    function exportBackup(){
      const blob = new Blob([JSON.stringify({app:'emiliarity',version:6,exportedAt:new Date().toISOString(),tasks:data.tasks,trash:data.trash,completed:data.completed,settings:data.settings,lastDate:data.lastDate},null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'emiliarity-backup-' + todayKey() + '.json';
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      toast('Backup exported');
    }

    function importBackup(file){
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const obj = JSON.parse(reader.result);
          if (!['drift','emiliarity'].includes(obj.app) || !Array.isArray(obj.tasks) || !Array.isArray(obj.trash)) throw Error('Invalid backup');
          if (!confirm('Replace all existing tasks with this backup?')) return;
          const valid = t => t && typeof t.title === 'string' && t.title.trim() && (t.day === 'heap' || Number.isInteger(t.day) && t.day >= 0 && t.day < 7);
          const clean = t => ({id:String(t.id || makeId()), title:t.title.slice(0,140), description:String(t.description || '').slice(0,5000), day:t.day, createdAt:t.createdAt || Date.now(), ...(t.deletedAt ? {deletedAt:t.deletedAt} : {})});
          data.tasks = obj.tasks.filter(valid).map(clean);
          data.trash = obj.trash.filter(valid).slice(0,80).map(clean);
          data.completed = Array.isArray(obj.completed) ? obj.completed.filter(valid).map(t=>({...clean(t),completedAt:t.completedAt||Date.now()})) : [];
          data.lastDate = fromKey(obj.lastDate) ? obj.lastDate : todayKey();
          if (obj.settings && typeof obj.settings === 'object') data.settings = Object.assign(data.settings, obj.settings);
          save(); rollover(); closeSheet(); currentDay = today(); surface = 'day'; render(); toast('Backup restored');
        } catch {
          toast('Could not read backup');
        }
      };
      reader.readAsText(file);
    }

        <div class="setting"><span>Darken background</span><input type="range" min="0" max="90" id="dim"></div>
        <div class="setting"><span>Sounds</span><input id="sound" type="checkbox"></div>
        <div class="setting"><span>Haptics</span><input id="haptics" type="checkbox"></div>
        <div class="setting"><span>Motion</span><input id="motion" type="checkbox"></div>
        <div class="actions"><button id="backup">Export backup</button><button id="restoreBackup">Import backup</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>
        <p class="note">Hold empty space to add. Tap a task for details, hold to complete. Swipe down from a weekday for Todo, then again for Heap. Swipe up to return. Hold a downward pull at the bottom edge for a surprise.</p>
        <div class="actions"><button id="done" class="primary">Done</button></div>
      `;
      const custom=data.settings.colors||['#f4bfd8','#9fe5f4','#d8bef6'];
      ['colorA','colorB','colorC'].forEach((id,i)=>{
        $(id).value=custom[i];
        $(id).oninput=()=>{
          data.settings.colors=[$('colorA').value,$('colorB').value,$('colorC').value];
          save();theme();
        };
      });
      const refresh=()=>{closeSheet();openSettings()};
      $('resetBackground').onclick=()=>{
        data.settings.colors=null;data.settings.theme='iridescent';
        data.settings.dim=34;data.settings.backgroundImage=null;data.settings.gradientOpacity=72;data.settings.backgroundBlur=0;
        save();theme();refresh();toast('Default background restored');
      };
      $('imageUpload').onclick=()=>$('backgroundFile').click();
      $('removeImage').onclick=()=>{data.settings.backgroundImage=null;save();theme();toast('Image removed')};
      $('backgroundFile').onchange=e=>{
        const file=e.target.files?.[0];if(!file)return;
        if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('Choose a PNG, JPEG or WebP image');return}
        const reader=new FileReader();
        reader.onload=()=>{
          const img=new Image();
          img.onload=()=>{
            const canvas=document.createElement('canvas');
            const factor=Math.min(1,1280/Math.max(img.width,img.height));
            canvas.width=Math.max(1,Math.round(img.width*factor));canvas.height=Math.max(1,Math.round(img.height*factor));
            const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
            // JPEG compression keeps user image storage within a practical size.
            const previous=data.settings.backgroundImage;
            data.settings.backgroundImage=canvas.toDataURL('image/jpeg',.76);
            try{localStorage.setItem(KEY,JSON.stringify(data));theme();toast('Background imported')}
            catch{data.settings.backgroundImage=previous;theme();toast('Image too large for device storage')}
          };
          img.onerror=()=>toast('Could not load image');
          img.src=reader.result;
        };
        reader.readAsDataURL(file);
      };
      $('backgroundBlur').value=data.settings.backgroundBlur;
      $('backgroundBlur').oninput=e=>{data.settings.backgroundBlur=+e.target.value;save();theme()};
      $('heapDecayDays').value=String(data.settings.heapDecayDays);
      $('heapDecayDays').onchange=e=>{data.settings.heapDecayDays=+e.target.value;cleanExpired();save();render();toast('Heap retention updated')};
      $('gradientOpacity').value=data.settings.gradientOpacity;
      $('gradientOpacity').oninput=e=>{data.settings.gradientOpacity=+e.target.value;save();theme()};
      $('dim').value=data.settings.dim;
      for(const k of ['sound','haptics','motion'])$(k).checked=!!data.settings[k];
      $('dim').oninput=e=>{data.settings.dim=+e.target.value;save();theme()};
      for(const k of ['sound','haptics','motion'])$(k).onchange=e=>{data.settings[k]=e.target.checked;save();theme()};
      body.querySelectorAll('[data-color]').forEach(b=>{
        b.classList.toggle('selected',b.dataset.color===data.settings.theme);
        b.onclick=()=>{
          data.settings.theme=b.dataset.color;data.settings.colors=null;save();theme();
          body.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===b));feedback();
        };
      });
      $('backup').onclick=exportBackup;
      $('restoreBackup').onclick=()=>$('importFile').click();
      $('importFile').onchange=e=>importBackup(e.target.files[0]);
      $('done').onclick=closeSheet;
    }

    function syncFades(scroller, topFade, bottomFade){
      requestAnimationFrame(() => {
        if (!scroller) return;
        const horizontal=scroller.classList.contains('column-scroller');
        const overflow = horizontal ? scroller.scrollWidth > scroller.clientWidth+2 : scroller.scrollHeight > scroller.clientHeight+2;
        scroller.classList.toggle('no-scroll', !overflow);
        topFade.classList.toggle('show', overflow && (horizontal ? scroller.scrollLeft>3 : scroller.scrollTop>3));
        bottomFade.classList.toggle('show', overflow && (horizontal ? scroller.scrollLeft+scroller.clientWidth<scroller.scrollWidth-3 : scroller.scrollTop+scroller.clientHeight<scroller.scrollHeight-3));
      });
    }

    function syncAllFades(){
      syncFades($('dayContent'), $('dayFadeTop'), $('dayFadeBottom'));
      syncFades($('heapContent'), $('heapFadeTop'), $('heapFadeBottom'));
      syncFades($('trashContent'), $('trashFadeTop'), $('trashFadeBottom'));
    }

    ['dayContent','heapContent','trashContent'].forEach((id, i) => {
      const scroller = $(id);
      const pairs = [[$('dayFadeTop'),$('dayFadeBottom')],[$('heapFadeTop'),$('heapFadeBottom')],[$('trashFadeTop'),$('trashFadeBottom')]][i];
      if(i){scroller.classList.add('column-scroller');pairs[0].classList.add('fade-x');pairs[1].classList.add('fade-x');}
      scroller.addEventListener('scroll', () => syncFades(scroller, pairs[0], pairs[1]), {passive:true});
      scroller.addEventListener('contextmenu', e => e.preventDefault());
      scroller.addEventListener('selectstart', e => {
        if (!e.target.closest('input,textarea')) e.preventDefault();
      });
    });

    function clearBlank(){ clearTimeout(blankTimer); blankTimer = null; blankStart = null; }
    function pointerAddHandler(scroller){
      scroller.addEventListener('pointerdown', e => {
        if (modal || surface === 'trash' || e.target.closest('.task,button,.paper,input,textarea')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        clearBlank();
        blankStart = [e.clientX, e.clientY];
        blankTimer = setTimeout(() => {
          suppressClickUntil = Date.now() + 700;
          clearBlank();
          openCreate();
        }, 475);
      });
      scroller.addEventListener('pointermove', e => {
        if (blankStart && Math.hypot(e.clientX - blankStart[0], e.clientY - blankStart[1]) > 12) clearBlank();
      });
      scroller.addEventListener('pointerup', clearBlank);
      scroller.addEventListener('pointercancel', clearBlank);
    }
    pointerAddHandler($('dayContent'));
    pointerAddHandler($('heapContent'));

    $('heapSettings').onclick = openSettings;

    // Mouse/trackpad input: direct, pixel-for-pixel horizontal dragging in Todo and Heap.
    // Do not bind a CSS transition to scrollLeft; motion follows the pointer instantly.
    for(const id of ['heapContent','trashContent']){
      const scroller=$(id);
      let drag=null;
      scroller.addEventListener('pointerdown',e=>{
        if(e.pointerType!=='mouse'||e.button!==0||modal)return;
        drag={x:e.clientX,y:e.clientY,scrollLeft:scroller.scrollLeft,moved:false};
      });
      scroller.addEventListener('pointermove',e=>{
        if(!drag||!(e.buttons&1))return;
        const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
        if(!drag.moved&&Math.abs(dx)<5)return;
        if(!drag.moved&&Math.abs(dx)<Math.abs(dy))return;
        drag.moved=true;
        scroller.classList.add('mouse-dragging');
        scroller.scrollLeft=drag.scrollLeft-dx;
        clearBlank();
        e.preventDefault();
      });
      const finishDrag=()=>{
        if(drag?.moved){
          scroller.dataset.suppressTaskClick='1';
          setTimeout(()=>{delete scroller.dataset.suppressTaskClick},120);
        }
        drag=null;
        scroller.classList.remove('mouse-dragging');
      };
      scroller.addEventListener('pointerup',finishDrag);
      scroller.addEventListener('pointercancel',finishDrag);
      scroller.addEventListener('pointerleave',e=>{if(drag&&!(e.buttons&1))finishDrag()});
      scroller.addEventListener('click',e=>{
        if(scroller.dataset.suppressTaskClick==='1'){
          e.preventDefault();e.stopImmediatePropagation();
        }
      },true);
      // Vertical mouse-wheel deltas translate to continuous horizontal movement.
      scroller.addEventListener('wheel',e=>{
        if(scroller.scrollWidth<=scroller.clientWidth+2)return;
        const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
        scroller.scrollLeft+=delta;
        e.preventDefault();
      },{passive:false});
    }

    const shell = $('shell');
    shell.addEventListener('touchstart', e => {
      if (modal || e.target.closest('input,textarea,.heap-settings')) return;
      const p = e.touches[0];
      const scroller = e.target.closest('.content') || scrollerForSurface(surface);
      gesture = { x:p.clientX, y:p.clientY, scroller, startScroll: scroller.scrollTop, startScrollLeft:scroller.scrollLeft, surfaceAtStart: surface, bottomEdge:p.clientY>window.innerHeight-105, topEdge:p.clientY<Math.max(140,window.innerHeight*.21), peeking:false, topPeeking:false };
    }, {passive:true});

    shell.addEventListener('touchmove', e => {
      if (!gesture) return;
      const p = e.touches[0];
      if (Math.abs(p.clientY - gesture.y) > 14 || Math.abs(p.clientX - gesture.x) > 14) clearBlank();
      const dy=p.clientY-gesture.y,dx=p.clientX-gesture.x;
      // At the very top of Heap, a downward held pull lifts the entire screen
      // to reveal Emilia. Normal downward navigation is unchanged elsewhere.
      if(surface==='trash' && gesture.topEdge && dy>32 && Math.abs(dx)<70 && (gesture.scroller?.scrollLeft||0)<5){
        gesture.topPeeking=true;
        const drop=Math.min(190,Math.max(48,dy*.78));
        shell.style.setProperty('--top-peek-drop',`${drop}px`);
        shell.classList.add('easter-drop');
        $('topPeek').classList.add('active');
        if(e.cancelable)e.preventDefault();
        return;
      }
      const dayScroll=$('dayContent');
      const canPeek=gesture.bottomEdge && surface==='day' && dayScroll.scrollHeight<=dayScroll.clientHeight+2;
      if(canPeek && dy < -28 && Math.abs(dx)<70){
        gesture.peeking=true;
        const lift=Math.min(168,Math.max(65,-dy*.8));
        shell.style.setProperty('--peek-lift',`-${lift}px`);
        document.documentElement.style.setProperty('--peek-open',lift+'px');
        shell.classList.add('easter-lift');
        $('peek').classList.add('active');
        if(e.cancelable)e.preventDefault();return;
      }
      if(dy < -28 && Math.abs(dy)>Math.abs(dx)*1.2 && (surface==='heap'||surface==='trash') && e.cancelable)e.preventDefault();
    }, {passive:false});

    shell.addEventListener('touchend', e => {
      if (!gesture || modal) return;
      if(gesture.peeking){shell.classList.remove('easter-lift');$('peek').classList.remove('active');gesture=null;return;}
      if(gesture.topPeeking){shell.classList.remove('easter-drop');$('topPeek').classList.remove('active');gesture=null;return;}
      const p = e.changedTouches[0];
      const dx = p.clientX - gesture.x;
      const dy = p.clientY - gesture.y;
      const absX = Math.abs(dx), absY = Math.abs(dy);
      const scroller = gesture.scroller || scrollerForSurface(surface);
      const atTop = (scroller?.scrollTop || 0) < 6;
      if(surface!=='day' && absX>48 && absX>absY*1.12){
        // Native horizontal pan remains primary; this handles Android webviews
        // that swallow the touch because of a surrounding gesture handler.
        // The upper lists follow the finger natively instead of jumping by a page.
        // Deliberately don't add an animated scrollBy here.
      } else if (surface === 'day' && absX > 55 && absX > absY * 1.2) {
        moveDay(currentDay + (dx < 0 ? 1 : -1), dx < 0 ? 'left' : 'right');
      } else if (absY > 70 && absY > absX * 1.2 && (dy < 0 || atTop)) {
        if (dy > 0) {
          if (surface === 'day') moveVertical('heap');
          else if (surface === 'heap') moveVertical('trash');
        } else {
          if (surface === 'trash') moveVertical('heap');
          else if (surface === 'heap') moveVertical('day');
        }
      }
      gesture = null;
    }, {passive:true});

    shell.addEventListener('touchcancel', () => { $('peek').classList.remove('active');shell.classList.remove('easter-lift');$('topPeek').classList.remove('active');shell.classList.remove('easter-drop');gesture = null; clearBlank(); });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSheet();
      if (modal) return;
      if (surface === 'day' && e.key === 'ArrowLeft') moveDay(currentDay + 1, 'left');
      if (surface === 'day' && e.key === 'ArrowRight') moveDay(currentDay - 1, 'right');
      if (surface === 'day' && e.key === 'ArrowDown') moveVertical('heap');
      if (surface === 'heap' && e.key === 'ArrowDown') moveVertical('trash');
      if (surface === 'heap' && e.key === 'ArrowUp') moveVertical('day');
      if (surface === 'trash' && e.key === 'ArrowUp') moveVertical('heap');
      if (e.key === 'n' && !e.ctrlKey && !e.metaKey) openCreate();
    });

    document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
    window.addEventListener('resize', () => {renderHeap();renderTrash();syncAllFades();});
    setInterval(() => { if (!document.hidden && todayKey() !== data.lastDate) render(); }, 60000);

    render();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  })();
  </script>
</body>
</html>
